# Local demo only. Separate project and database volume; never use with Azure compose.
name: global-village-family-demo
services:
  family-api:
    build: ./family-server
    environment:
      PORT: 3003
      HOST: 0.0.0.0
      NODE_ENV: development
      FAMILY_DEMO_MODE: "1"
      FAMILY_DB_PATH: /app/data/family.sqlite
      AUTH_API_ME_URL: http://host.docker.internal:3002/auth/me
      ALLOWED_ORIGINS: http://localhost:7357
    ports: ["127.0.0.1:3003:3003"]
    volumes: [family-demo-data:/app/data]
volumes:
  family-demo-data:
