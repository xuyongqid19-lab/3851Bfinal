server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    location = /public-health { default_type application/json; return 200 '{"ok":true}'; }
    location /api/auth/ { proxy_pass http://auth-api:3001/; include /etc/nginx/proxy_params; }
    location /api/chat/ { proxy_pass http://chat-api:3004/; include /etc/nginx/proxy_params; }
    location /api/community/ { proxy_pass http://community-api:3000/; include /etc/nginx/proxy_params; }
    location /api/family/ { proxy_pass http://family-api:3003/; include /etc/nginx/proxy_params; }
    location /auth/ { proxy_pass http://auth-api:3001; include /etc/nginx/proxy_params; }
    location /chat/ { proxy_pass http://chat-api:3004; include /etc/nginx/proxy_params; }
    location /community/ { proxy_pass http://community-api:3000; include /etc/nginx/proxy_params; }
    location /families { proxy_pass http://family-api:3003; include /etc/nginx/proxy_params; }
    location / { try_files $uri $uri/ /index.html; }
}
